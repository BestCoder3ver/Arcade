<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jake's Checkers Hub</title>

<style>
button,[role="button"]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{margin:0;background:black;color:white;font-family:Arial,sans-serif;min-height:100vh}
.sidebar{width:100%;min-height:100vh;background:black;padding:20px;padding-bottom:110px;box-sizing:border-box;display:flex;flex-direction:column}
.sidebar h1{margin-top:0;margin-bottom:10px}
.timer-row{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.games-grid{display:grid;grid-template-columns:repeat(auto-fit,150px);gap:12px;flex:1;align-content:start;justify-content:center}
h1{color:cyan;text-align:center;text-shadow:0 0 15px cyan}
button{padding:12px;font-size:16px;font-weight:bold;border:none;border-radius:10px;background:cyan;color:black;cursor:pointer;transition:.2s;min-height:50px}
button:hover{background:white;transform:scale(1.03)}
#passwordOverlay{position:fixed;left:0;top:0;width:100%;height:100%;box-sizing:border-box;background:rgba(0,0,0,.92);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:99999;color:white;text-align:center;padding:20px}
#passwordOverlay h1{color:cyan;text-shadow:0 0 15px cyan;margin-bottom:10px}
#passwordOverlay p{max-width:500px;width:100%;line-height:1.4;margin-bottom:20px;color:#aaa}
#passwordOverlay input{padding:15px;width:320px;max-width:100%;box-sizing:border-box;font-size:20px;border-radius:8px;border:2px solid cyan;background:#111;color:white;text-align:center;margin-bottom:15px}
#passwordOverlay button{width:auto;padding:12px 40px;font-size:18px;font-weight:bold;border:none;border-radius:10px;background:cyan;color:black;cursor:pointer;transition:.2s}
#passwordOverlay button:hover{background:white;transform:scale(1.03)}
#pwError{color:#ff4444;margin-top:15px;font-size:16px}
#resetTimerBtn{width:auto;padding:8px 16px;font-size:14px;font-weight:bold;border:2px solid #ff4444;border-radius:8px;background:#331111;color:#ff6666;cursor:pointer;transition:.2s}
#resetTimerBtn:hover{background:#551111;color:#ff8888;transform:scale(1.03)}
#timerDisplay{font-size:14px;color:#88ff88;font-family:monospace;min-height:18px}
</style>
</head>

<body>
<div id="passwordOverlay">
    <h1>🔒 Password Required</h1>
    <p>This arcade is locked. Enter the password to unlock Jake's checkers for 24 hours.</p>
    <input id="pwInput" type="password" placeholder="Enter password...">
    <button id="pwSubmit">Unlock</button>
    <p id="pwError"></p>
</div>

<div class="sidebar">
    <h1>🎮 Jake's Checkers Hub</h1>
    <div class="timer-row">
        <div id="timerDisplay"></div>
        <button id="resetTimerBtn">Reset Timer</button>
    </div>

    <div class="games-grid">
        <button onclick="checkAuthThenGo('checkersJake.html')">
            🔴 Checkers Jake
        </button>
    </div>
</div>

<script>
const CORRECT_PASSWORD="jjaakkee";
const UNLOCK_DURATION=24*60*60*1000;
const overlay=document.getElementById("passwordOverlay");
const input=document.getElementById("pwInput");
const error=document.getElementById("pwError");
const timerDisplay=document.getElementById("timerDisplay");
function getUnlockTime(){return parseInt(localStorage.getItem("globalUnlockTime"))||0}
function isUnlocked(){return Date.now()<getUnlockTime()}
function updateOverlay(){overlay.style.display=isUnlocked()?"none":"flex"}
function unlock(){localStorage.setItem("globalUnlockTime",String(Date.now()+UNLOCK_DURATION));error.textContent="";updateOverlay();updateTimer()}
function tryPassword(){if(input.value===CORRECT_PASSWORD)unlock();else{error.textContent="Wrong password.";input.value="";input.focus()}}
function checkAuthThenGo(page){if(isUnlocked())location.href=page;else updateOverlay()}
function updateTimer(){const left=getUnlockTime()-Date.now();if(left<=0){localStorage.removeItem("globalUnlockTime");timerDisplay.textContent="Locked";updateOverlay();return}const h=Math.floor(left/3600000),m=Math.floor(left%3600000/60000),s=Math.floor(left%60000/1000);timerDisplay.textContent=`Unlocked: ${h}h ${m}m ${s}s`}
document.getElementById("pwSubmit").onclick=tryPassword;
input.addEventListener("keydown",e=>{if(e.key==="Enter")tryPassword()});
document.getElementById("resetTimerBtn").onclick=()=>{localStorage.removeItem("globalUnlockTime");updateTimer();updateOverlay()};
updateOverlay();
updateTimer();
setInterval(updateTimer,1000);
</script>
</body>
</html>
