<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Checkers</title>
  <style>
    button,[role="button"]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:#15161f;color:#f5f7fb;font-family:Arial,sans-serif}
    body{display:flex;align-items:stretch;justify-content:center;overflow:hidden}
    #app{width:min(100vw,820px);height:100vh;display:grid;grid-template-rows:auto auto auto auto 1fr;padding:8px 10px;gap:6px}
    header{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
    #titleArea,#hubArea{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
    #hubArea{align-items:flex-end}
    h1{margin:0;font-size:26px;text-align:left}
    #stats{display:flex;gap:8px;justify-content:flex-end}
    .stat{min-width:58px;background:#222638;border:1px solid #38405f;border-radius:7px;padding:5px 8px;text-align:center}
    .stat strong{display:block;font-size:17px}.stat span{display:block;font-size:10px;color:#b8c1d8}
    #topControls{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
    #difficulty{display:flex;gap:6px;justify-content:center}
    button{border:0;border-radius:7px;background:#f97316;color:#220b02;font-weight:bold;font-size:14px;min-height:34px;cursor:pointer}
    button.active{background:#facc15}button:hover{filter:brightness(1.08)}
    #difficulty button{min-height:30px;padding:5px 12px;font-size:13px}
    #status{background:#222638;border:1px solid #38405f;border-radius:7px;padding:6px 10px;text-align:center;font-size:15px;min-height:32px}
    #players{display:flex;justify-content:center;gap:8px;color:#cdd6ea;font-size:13px;line-height:1}
    #boardWrap{display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
    #board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:min(98vw,calc(100vh - 176px),760px);aspect-ratio:1;border:4px solid #684019;box-shadow:0 12px 30px rgba(0,0,0,.35)}
    .sq{border:0;font-size:clamp(24px,7vw,56px);line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
    .piece{width:78%;height:78%;border-radius:50%;background:var(--piece-color);border:3px solid rgba(255,255,255,.38);box-shadow:inset 0 -8px 14px rgba(0,0,0,.32),inset 0 5px 10px rgba(255,255,255,.18),0 5px 10px rgba(0,0,0,.35);display:grid;place-items:center;position:relative}
    .piece.king::after{content:'♛';color:var(--crown-color);text-shadow:0 1px 3px rgba(0,0,0,.45);font-size:.62em;line-height:1}
    .playerPiece{width:14px;height:14px;border-radius:50%;display:inline-block;background:var(--piece-color);border:2px solid rgba(255,255,255,.45);vertical-align:-2px;box-shadow:inset 0 -3px 5px rgba(0,0,0,.35)}
    .light{background:#f0d9b5}.dark{background:#94613a}.sq.sel{outline:4px solid #facc15;outline-offset:-4px}.sq.move{box-shadow:inset 0 0 0 5px #22c55e}
    #titleArea button,#hubArea button{min-height:30px;padding:5px 14px;font-size:13px;min-width:94px}
    #newGame{background:#38bdf8;color:#062135}#pvp{background:#a78bfa;color:#160f32}#colorsBtn{background:#34d399;color:#052e1d}
    #back{justify-self:end;padding:6px 10px;min-height:30px;background:cyan;color:#000;font-size:12px}
    #colorModal,#startModal{position:fixed;inset:0;background:rgba(5,7,12,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
    #colorModal.open,#startModal.open{display:flex}
    #colorPanel,#startPanel{width:min(92vw,360px);background:#222638;border:1px solid #4b5578;border-radius:8px;padding:16px;box-shadow:0 18px 48px rgba(0,0,0,.5)}
    #colorPanel h2,#startPanel h2{margin:0 0 12px;font-size:22px}
    #startPanel p{margin:0 0 14px;color:#cdd6ea;font-size:15px;line-height:1.35}
    .colorRow{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;margin:10px 0}
    .colorRow strong{font-size:15px}
    .swatches{display:flex;gap:7px;flex-wrap:wrap}
    .swatch{width:32px;min-width:32px;height:32px;min-height:32px;border-radius:50%;background:var(--swatch);border:3px solid var(--swatch);padding:0;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
    .swatch.active{background:var(--swatch);border-color:var(--swatch);outline:3px solid var(--swatch);outline-offset:3px;box-shadow:0 0 0 2px rgba(255,255,255,.65)}
    #colorError{min-height:18px;color:#fecaca;font-size:13px;margin:8px 0 0}
    #colorActions,#startActions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
    #saveColors,#startYou{background:#38bdf8;color:#062135}#cancelColors{background:#64748b;color:#fff}#startAi{background:#a78bfa;color:#160f32}
    @media(max-width:560px){#app{padding:7px;gap:5px}header{gap:6px}h1{font-size:22px}.stat{min-width:48px;padding:4px 6px}.stat strong{font-size:15px}#topControls{gap:6px;flex-wrap:nowrap}#difficulty{gap:4px}#difficulty button{padding:4px 7px;font-size:12px;min-height:28px}#status{font-size:13px;min-height:29px}#players{font-size:12px;gap:5px}#board{width:min(98vw,calc(100vh - 150px))}#titleArea button,#hubArea button{min-height:28px;font-size:12px;padding:4px 8px;min-width:auto}#back{font-size:11px;min-height:28px}}
  </style>
</head>
<body>
<main id="app">
  <header><div id="titleArea"><h1>🔴 Checkers</h1><button id="newGame">New Game</button></div><div id="stats"><div class="stat"><strong id="wins">0</strong><span>Wins</span></div><div class="stat"><strong id="total">0</strong><span>Total</span></div></div><div id="hubArea"><button id="back" onclick="location.href='index.html'">Back to Hub</button><button id="pvp">PvP</button><button id="colorsBtn">Colors</button></div></header>
  <div id="topControls"><div id="difficulty"><button class="active" data-difficulty="easy">Easy</button><button data-difficulty="medium">Medium</button><button data-difficulty="hard">Hard</button></div></div>
  <div id="status">Your turn - move bottom</div>
  <div id="players"><span>You: <i id="youPiece" class="playerPiece"></i></span><span>|</span><span id="opponentLabel">AI: <i id="oppPiece" class="playerPiece"></i></span><span>|</span><span id="modeLabel">Easy</span></div>
  <section id="boardWrap"><div id="board"></div></section>
</main>
<div id="colorModal" role="dialog" aria-modal="true" aria-labelledby="colorTitle">
  <div id="colorPanel">
    <h2 id="colorTitle">Colors</h2>
    <div class="colorRow"><strong>Top:</strong><div id="topColors" class="swatches"></div></div>
    <div class="colorRow"><strong>Bottom:</strong><div id="bottomColors" class="swatches"></div></div>
    <div id="colorError"></div>
    <div id="colorActions"><button id="cancelColors">Cancel</button><button id="saveColors">Save</button></div>
  </div>
</div>
<div id="startModal" role="dialog" aria-modal="true" aria-labelledby="startTitle">
  <div id="startPanel">
    <h2 id="startTitle">Start Game?</h2>
    <p>Do you want to start, or do you want the AI to start?</p>
    <div id="startActions"><button id="startAi">AI Starts</button><button id="startYou">You Start</button></div>
  </div>
</div>
<script>
(function(){const u=parseInt(localStorage.getItem('globalUnlockTime'))||0;if(Date.now()>=u){localStorage.removeItem('globalUnlockTime');location.href='index.html?needauth=1';return;}setInterval(()=>{const t=parseInt(localStorage.getItem('globalUnlockTime'))||0;if(Date.now()>=t){localStorage.removeItem('globalUnlockTime');location.href='index.html?needauth=1';}},1000);})();
const SIZE=8, RED='r', BLACK='b';
const boardEl=document.getElementById('board'), statusEl=document.getElementById('status'), winsEl=document.getElementById('wins'), totalEl=document.getElementById('total'), modeLabel=document.getElementById('modeLabel'), opponentLabel=document.getElementById('opponentLabel'), pvpBtn=document.getElementById('pvp'), colorsBtn=document.getElementById('colorsBtn'), colorModal=document.getElementById('colorModal'), startModal=document.getElementById('startModal'), topColorsEl=document.getElementById('topColors'), bottomColorsEl=document.getElementById('bottomColors'), colorError=document.getElementById('colorError'), youPiece=document.getElementById('youPiece');
const difficultyButtons=[...document.querySelectorAll('[data-difficulty]')];
let board=[], turn=RED, selected=null, legal=[], gameOver=false, pvp=false, difficulty='easy', chaining=false, choosingStart=false, gameStarted=false;
let stats=JSON.parse(localStorage.getItem('checkers_stats')||'{"wins":0,"total":0}');
const colorChoices=[{name:'Red',value:'#ef4444'},{name:'Black',value:'#111827'},{name:'Blue',value:'#2563eb'},{name:'Green',value:'#22c55e'},{name:'Yellow',value:'#facc15'},{name:'Purple',value:'#a855f7'},{name:'Orange',value:'#f97316'},{name:'Pink',value:'#ec4899'},{name:'Cyan',value:'#06b6d4'},{name:'Lime',value:'#84cc16'},{name:'White',value:'#f8fafc'},{name:'Gray',value:'#64748b'},{name:'Brown',value:'#92400e'},{name:'Teal',value:'#14b8a6'},{name:'Navy',value:'#1e3a8a'}];
let pieceColors=loadColors(), draftColors={...pieceColors};
let audioCtx;
function ctx(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function tone(f,d,type='triangle',v=.08,delay=0,end){const c=ctx(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,s);if(end)o.frequency.exponentialRampToValueAtTime(end,s+d);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d);}
function humanSound(){tone(330,.08,'triangle',.07,0,440)}function aiSound(){tone(196,.1,'sine',.065,0,147)}function capSound(){tone(160,.1,'square',.055,0,95);tone(360,.08,'triangle',.04,.05)}function winSound(){[392,523.25,659.25,783.99].forEach((f,i)=>tone(f,.15,'triangle',.08,i*.09))}function loseSound(){tone(293.66,.16,'sawtooth',.06,0,196);tone(174.61,.28,'sine',.065,.14,130.81)}
function saveStats(){localStorage.setItem('checkers_stats',JSON.stringify(stats));winsEl.textContent=stats.wins;totalEl.textContent=stats.total}
function loadColors(){try{const saved=JSON.parse(localStorage.getItem('checkers_colors')||'{}'),allowed=colorChoices.map(c=>c.value);if(saved.top==='#111827'&&saved.bottom==='#ef4444')return{top:'#111827',bottom:'#f8fafc'};if(allowed.includes(saved.top)&&allowed.includes(saved.bottom)&&saved.top!==saved.bottom)return saved}catch(e){}return{top:'#111827',bottom:'#f8fafc'}}
function savePieceColors(){localStorage.setItem('checkers_colors',JSON.stringify(pieceColors))}
function pieceColor(side){return side===BLACK?pieceColors.top:pieceColors.bottom}
function crownColor(color){const h=color.replace('#',''),r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return r*0.299+g*0.587+b*0.114>155?'#111827':'#ffffff'}
function pieceHtml(p){const color=pieceColor(p.side);return `<span class="piece${p.king?' king':''}" style="--piece-color:${color};--crown-color:${crownColor(color)}"></span>`}
function updatePlayerPieces(){youPiece.style.setProperty('--piece-color',pieceColors.bottom);document.getElementById('oppPiece').style.setProperty('--piece-color',pieceColors.top)}
function makeSwatches(container,slot){container.innerHTML='';colorChoices.forEach(color=>{const btn=document.createElement('button');btn.className='swatch';btn.type='button';btn.title=color.name;btn.setAttribute('aria-label',color.name);btn.style.setProperty('--swatch',color.value);btn.onclick=()=>{draftColors[slot]=color.value;paintSwatches()};container.appendChild(btn)})}
function paintSwatches(){[...topColorsEl.children].forEach((btn,i)=>btn.classList.toggle('active',colorChoices[i].value===draftColors.top));[...bottomColorsEl.children].forEach((btn,i)=>btn.classList.toggle('active',colorChoices[i].value===draftColors.bottom))}
function openColors(){draftColors={...pieceColors};colorError.textContent='';paintSwatches();colorModal.classList.add('open')}
function closeColors(){colorModal.classList.remove('open')}
function applyColors(){if(draftColors.top===draftColors.bottom){colorError.textContent='Top and Bottom cannot be the same color.';return}pieceColors={...draftColors};savePieceColors();updatePlayerPieces();render();labels();closeColors()}
function makeBoard(){boardEl.innerHTML='';for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){const sq=document.createElement('button');sq.className='sq '+((r+c)%2?'dark':'light');sq.dataset.r=r;sq.dataset.c=c;sq.onclick=()=>clickSquare(r,c);boardEl.appendChild(sq)}}
function setupBoard(){board=Array.from({length:SIZE},()=>Array(SIZE).fill(null));for(let r=0;r<3;r++)for(let c=0;c<SIZE;c++)if((r+c)%2)board[r][c]={side:BLACK,king:false};for(let r=5;r<8;r++)for(let c=0;c<SIZE;c++)if((r+c)%2)board[r][c]={side:RED,king:false}}
function showReadyBoard(){setupBoard();turn=null;selected=null;legal=[];chaining=false;gameOver=false;choosingStart=false;gameStarted=false;startModal.classList.remove('open');render();labels()}
function newGame(){setupBoard();turn=pvp?null:RED;selected=null;legal=[];chaining=false;gameOver=false;gameStarted=true;choosingStart=!pvp;render();labels();if(choosingStart)startModal.classList.add('open');else startModal.classList.remove('open')}
function chooseStarter(side){choosingStart=false;startModal.classList.remove('open');turn=side;selected=null;legal=[];render();labels();if(!pvp&&turn===BLACK)setTimeout(aiMove,220)}
function labels(){opponentLabel.innerHTML=(pvp?'Player 2: ':'AI: ')+'<i id="oppPiece" class="playerPiece"></i>';modeLabel.textContent=pvp?'PvP':cap(difficulty);pvpBtn.textContent=pvp?'AI Mode':'PvP';document.getElementById('oppPiece').style.setProperty('--piece-color',pieceColors.top);youPiece.style.setProperty('--piece-color',pieceColors.bottom);if(gameOver)return;if(!gameStarted){statusEl.textContent='Press New Game to start';return}if(choosingStart){statusEl.textContent='Choose who starts';return}statusEl.textContent=pvp?(turn?turn===RED?'Bottom turn':'Top turn':'Move any piece to start'):(turn===RED?'Your turn - move bottom':'AI is thinking...')}
function render(){[...boardEl.children].forEach((sq,i)=>{const r=Math.floor(i/SIZE),c=i%SIZE,p=board[r][c];sq.innerHTML=p?pieceHtml(p):'';sq.classList.toggle('sel',selected&&selected.r===r&&selected.c===c);sq.classList.toggle('move',legal.some(m=>m.to.r===r&&m.to.c===c))})}
function clickSquare(r,c){if(!gameStarted||gameOver||choosingStart||(!pvp&&turn!==RED))return;const m=legal.find(x=>x.to.r===r&&x.to.c===c);if(m){doMove(m,true);return}if(chaining)return;const p=board[r][c];if(pvp&&!turn&&p)turn=p.side;if(p&&p.side===turn){selected={r,c};legal=legalMoves(turn).filter(m=>m.from.r===r&&m.from.c===c);render();labels()}}
function dirs(p){return p.king?[[-1,-1],[-1,1],[1,-1],[1,1]]:(p.side===RED?[[-1,-1],[-1,1]]:[[1,-1],[1,1]])}
function captureMovesFrom(r,c,b=board){const p=b[r][c];if(!p)return[];let caps=[];for(const[dr,dc]of dirs(p)){if(p.king){let nr=r+dr,nc=c+dc;while(inb(nr,nc)&&!b[nr][nc]){nr+=dr;nc+=dc}if(inb(nr,nc)&&b[nr][nc].side!==p.side){const landR=nr+dr,landC=nc+dc;if(inb(landR,landC)&&!b[landR][landC])caps.push({from:{r,c},to:{r:landR,c:landC},cap:{r:nr,c:nc}})}}else{const r1=r+dr,c1=c+dc,r2=r+dr*2,c2=c+dc*2;if(inb(r2,c2)&&b[r1][c1]&&b[r1][c1].side!==p.side&&!b[r2][c2])caps.push({from:{r,c},to:{r:r2,c:c2},cap:{r:r1,c:c1}})}}return caps}
function forcedLanding(m){if(!m.cap)return m;const dr=Math.sign(m.cap.r-m.from.r),dc=Math.sign(m.cap.c-m.from.c);return {...m,to:{r:m.cap.r+dr,c:m.cap.c+dc}}}
function legalMoves(side,b=board){let moves=[],caps=[];for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){const p=b[r][c];if(!p||p.side!==side)continue;caps.push(...captureMovesFrom(r,c,b));for(const [dr,dc] of dirs(p)){if(p.king){let r1=r+dr,c1=c+dc;while(inb(r1,c1)&&!b[r1][c1]){moves.push({from:{r,c},to:{r:r1,c:c1}});r1+=dr;c1+=dc}}else{const r1=r+dr,c1=c+dc;if(inb(r1,c1)&&!b[r1][c1])moves.push({from:{r,c},to:{r:r1,c:c1}})}}}return caps.length?caps:moves}
function doMove(m,byHuman){m=forcedLanding(m);const p=board[m.from.r][m.from.c];board[m.from.r][m.from.c]=null;board[m.to.r][m.to.c]=p;if(m.cap){board[m.cap.r][m.cap.c]=null;capSound()}else byHuman?humanSound():aiSound();if((p.side===RED&&m.to.r===0)||(p.side===BLACK&&m.to.r===7))p.king=true;selected=null;legal=[];const winner=winnerSide();if(winner){end(winner);return}if(m.cap){const more=captureMovesFrom(m.to.r,m.to.c);if(more.length){selected={r:m.to.r,c:m.to.c};legal=more;chaining=true;render();statusEl.textContent=pvp?(turn===RED?'Bottom must keep jumping':'Top must keep jumping'):(turn===RED?'Keep jumping!':'AI keeps jumping...');if(!pvp&&turn===BLACK)setTimeout(()=>doMove(difficulty==='easy'?more[Math.floor(Math.random()*more.length)]:bestMove(more),false),260);return}}chaining=false;turn=turn===RED?BLACK:RED;render();labels();if(!pvp&&turn===BLACK)setTimeout(aiMove,220)}
function winnerSide(){const red=pieces(RED), black=pieces(BLACK);if(!red)return BLACK;if(!black)return RED;if(!legalMoves(turn).length)return turn===RED?BLACK:RED;return null}
function pieces(side){return board.flat().filter(p=>p&&p.side===side).length}
function aiMove(){if(gameOver)return;const moves=legalMoves(BLACK);if(!moves.length){end(RED);return}let move=difficulty==='easy'?moves[Math.floor(Math.random()*moves.length)]:bestMove(moves);doMove(move,false)}
function bestMove(moves){let best=moves[0],score=-1e9;for(const m of moves){const fm=forcedLanding(m),b=copy(board);apply(b,fm);let s=evaluate(b)+(fm.cap?60:0)+(b[fm.to.r][fm.to.c].king?25:0);if(difficulty==='hard')s-=bestReplyScore(b)*.55;s+=Math.random()*.1;if(s>score){score=s;best=fm}}return best}
function bestReplyScore(b){let best=0;for(const m of legalMoves(RED,b)){const bb=copy(b);apply(bb,m);best=Math.max(best,-evaluate(bb)+(m.cap?60:0))}return best}
function evaluate(b){let s=0;b.flat().forEach(p=>{if(p)s+=(p.side===BLACK?1:-1)*(p.king?175:100)});return s}
function apply(b,m){m=forcedLanding(m);const p=b[m.from.r][m.from.c];b[m.from.r][m.from.c]=null;b[m.to.r][m.to.c]=p;if(m.cap)b[m.cap.r][m.cap.c]=null;if((p.side===RED&&m.to.r===0)||(p.side===BLACK&&m.to.r===7))p.king=true}
function copy(b){return b.map(row=>row.map(p=>p?{...p}:null))}
function end(w){gameOver=true;stats.total++;if(w===RED&&!pvp)stats.wins++;saveStats();statusEl.textContent=pvp?(w===RED?'Bottom wins!':'Top wins!'):(w===RED?'You win!':'AI wins!');w===RED||pvp?winSound():loseSound();render()}
function inb(r,c){return r>=0&&r<SIZE&&c>=0&&c<SIZE}function cap(s){return s[0].toUpperCase()+s.slice(1)}
difficultyButtons.forEach(btn=>btn.onclick=()=>{difficulty=btn.dataset.difficulty;pvp=false;difficultyButtons.forEach(b=>b.classList.toggle('active',b===btn));showReadyBoard()});
document.getElementById('newGame').onclick=newGame;pvpBtn.onclick=()=>{pvp=!pvp;showReadyBoard()};colorsBtn.onclick=openColors;document.getElementById('cancelColors').onclick=closeColors;document.getElementById('saveColors').onclick=applyColors;document.getElementById('startYou').onclick=()=>chooseStarter(RED);document.getElementById('startAi').onclick=()=>chooseStarter(BLACK);colorModal.onclick=e=>{if(e.target===colorModal)closeColors()};
makeSwatches(topColorsEl,'top');makeSwatches(bottomColorsEl,'bottom');saveStats();makeBoard();updatePlayerPieces();showReadyBoard();
</script>
